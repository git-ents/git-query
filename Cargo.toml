[workspace]
members = [
    "crates/gix-query-ir",
    "crates/gix-query-parse",
    "crates/gix-query-check",
    "crates/gix-query-engine",
    "crates/gix-query-engine-naive",
    "crates/gix-query-demand",
    "crates/gix-query-host",
    "crates/gix-query-rules",
    "crates/gix-query-kernel",
    "crates/gix-query",
    "crates/git-query",
    "crates/test-support",
]
# Both need a nightly compiler because they link Nemo, which uses
# `#![feature(...)]`. Excluding them is what keeps `cargo test --workspace` a
# stable-toolchain command. See DEVPLAN.md 2.11.
exclude = [
    "crates/gix-query-engine-nemo",
    "spikes/nemo-spike",
]
resolver = "3"
