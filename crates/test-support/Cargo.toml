[package]
name = "test-support"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gix = { workspace = true }
# The claim fixture writes real signed claims through the real crates, so a
# test never asserts against a hand-rolled imitation of a claim. Shares the
# `git-attest` pin `gix-query-host` names, so fixture and reader cannot
# disagree.
git-attest = { workspace = true }
git-store = { workspace = true }
facet = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
