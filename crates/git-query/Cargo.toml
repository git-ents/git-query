[package]
name = "git-query"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Datalog query and rules layer over git, and its `git query` external subcommand."

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "gix/interrupt"]

[[bin]]
name = "git-query"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
gix-query-ir = { workspace = true }
gix-query-parse = { workspace = true }
gix-query-check = { workspace = true }
gix-query-eval = { workspace = true }
gix-query-host = { workspace = true }
gix-query-rules = { workspace = true }
gix = { workspace = true }
# `RefName`, for `run_body_as_of`'s override-set type -- the same as-of seam
# `gix-query-host::RepoFacts::as_of` is built on. Not a new capability this
# crate reaches into the repository with: `RefName` is a validated string,
# nothing more, and evaluation itself still runs entirely through
# `gix-query-host`.
gix-refstore = { workspace = true }
thiserror = { workspace = true }
# The cache key's hash function (`DEVPLAN.md` §1.1, Phase 6). Not a new trust
# boundary: sha2 is already several dependencies deep in this workspace.
sha2 = { workspace = true }
# CLI-only: the `git query` binary's argument parsing and error reporting.
# Absent unless the default `cli` feature is on, so a consumer can depend on
# the library alone.
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }

[dev-dependencies]
test-support = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
