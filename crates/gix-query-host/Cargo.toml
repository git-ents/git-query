[package]
name = "gix-query-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Repo-backed fact sources and the projection builtins for git-query."

[dependencies]
git-anchor = { workspace = true }
git-attest = { workspace = true }
git-store = { workspace = true }
gix-refstore = { workspace = true }
facet = { workspace = true }
gix-query-ir = { workspace = true }
gix = { workspace = true, features = ["blob-diff"] }
thiserror = { workspace = true }

[dev-dependencies]
test-support = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
