[package]
name = "gix-effect"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The effect doc, trigger detection, the executor seam, and the transition log -- see DEVPLAN-effect.md Part B."

[dependencies]
gix-query = { path = "../gix-query" }
gix-query-ir = { path = "../gix-query-ir" }
gix-query-parse = { path = "../gix-query-parse" }
gix-store = { git = "https://github.com/git-ents/git-store.git" }
gix-refstore = { git = "https://github.com/git-ents/git-store.git" }
facet-git-tree = { git = "https://github.com/git-ents/git-store.git" }
# Pinned, same rev `gix-query-host`/`test-support` name: the Action schema
# (D7) is attested through this crate's envelope, and its consumer contract
# must not drift out from under gix-effect on an unrelated lockfile refresh.
gix-attest = { git = "https://github.com/git-ents/git-anchor.git", rev = "4b98ae23f47a5415416e68bae7c88913798ad3ea" }
facet = { version = "0.50.0-rc.0", features = ["reflect"] }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "revision"] }
thiserror = "2"

[dev-dependencies]
test-support = { path = "../test-support" }
tempfile = "3"
