[package]
name = "git-effect"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The effect doc, trigger detection, the executor seam, and the transition log, plus the `git effect` external subcommand -- see DEVPLAN-effect.md Part B."

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:serde", "dep:toml", "gix/interrupt"]

[[bin]]
name = "git-effect"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
git-query = { workspace = true }
gix-query-ir = { workspace = true }
gix-query-parse = { workspace = true }
gix-store = { workspace = true }
gix-refstore = { workspace = true }
facet-git-tree = { workspace = true }
gix-attest = { workspace = true }
facet = { workspace = true }
gix = { workspace = true }
thiserror = { workspace = true }
# CLI-only: the `git effect` binary's argument parsing, error reporting, and
# the TOML shape it parses its `define` doc from. The library stays free of
# all four, per `DEVPLAN-effect.md`'s dependency list.
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
test-support = { workspace = true }
tempfile = { workspace = true }
