[package]
name = "git-effect"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A git external subcommand for defining git-effect docs. `define` only in this phase -- see DEVPLAN-effect.md Phase B1."

[[bin]]
name = "git-effect"
path = "src/main.rs"

[dependencies]
gix-effect = { path = "../gix-effect" }
gix-store = { git = "https://github.com/git-ents/git-store.git" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "interrupt", "revision"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
test-support = { path = "../test-support" }
tempfile = "3"
