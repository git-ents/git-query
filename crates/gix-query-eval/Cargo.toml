[package]
name = "gix-query-eval"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The magic-set rewrite, the Nemo lowering, the demand loop over host builtins, and derivation-tree recovery."
# Nemo is a git dependency because it is not published, and crates.io refuses
# any crate carrying one. See DEVPLAN.md 2.11.
publish = false

[dependencies]
gix-query-ir = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
nemo = { workspace = true }
nemo-physical = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# Test-only: builds real CheckedPrograms so fixtures exercise the actual
# nine passes rather than a hand-rolled stand-in. Never a normal dependency --
# gix-query-check has no reason to know this crate exists, and this crate's
# own code never calls it; only its test modules do.
gix-query-check = { workspace = true }
gix-query-parse = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
