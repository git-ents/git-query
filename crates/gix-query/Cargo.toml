[package]
name = "gix-query"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Datalog query and rules layer over git."

[dependencies]
gix-query-ir = { path = "../gix-query-ir" }
gix-query-parse = { path = "../gix-query-parse" }
gix-query-check = { path = "../gix-query-check" }
gix-query-eval = { path = "../gix-query-eval" }
gix-query-host = { path = "../gix-query-host" }
gix-query-rules = { path = "../gix-query-rules" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "revision"] }
# `RefName`, for `run_body_as_of`'s override-set type -- the same as-of seam
# `gix-query-host::RepoFacts::as_of` is built on. Not a new capability this
# crate reaches into the repository with: `RefName` is a validated string,
# nothing more, and evaluation itself still runs entirely through
# `gix-query-host`.
gix-refstore = { git = "https://github.com/git-ents/git-store.git" }
thiserror = "2"
# The cache key's hash function (`DEVPLAN.md` §1.1, Phase 6). Not a new trust
# boundary: sha2 is already several dependencies deep in this workspace.
sha2 = "0.10"

[dev-dependencies]
test-support = { path = "../test-support" }
rstest = "0.26"
tempfile = "3"
