[package]
name = "gix-query"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Datalog query and rules layer over git."

[dependencies]
gix-query-ir = { path = "../gix-query-ir" }
gix-query-parse = { path = "../gix-query-parse" }
gix-query-check = { path = "../gix-query-check" }
gix-query-eval = { path = "../gix-query-eval" }
gix-query-host = { path = "../gix-query-host" }
gix-query-rules = { path = "../gix-query-rules" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "revision"] }
thiserror = "2"

[dev-dependencies]
test-support = { path = "../test-support" }
rstest = "0.26"
tempfile = "3"
