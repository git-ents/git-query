[package]
name = "gix-query-engine-naive"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The stratified Datalog engine git-query ships: semi-naive, with a round-based mode kept as its own oracle."

[features]
# The round-based evaluator, retained permanently as the differential oracle
# for the semi-naive one. Not compiled into release builds.
oracle = []

[dependencies]
gix-query-engine = { path = "../gix-query-engine" }
gix-query-ir = { path = "../gix-query-ir" }
thiserror = "2"

[dev-dependencies]
gix-query-check = { path = "../gix-query-check" }
gix-query-parse = { path = "../gix-query-parse" }
proptest = "1"
rstest = "0.26"
